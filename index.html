<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бросок на свидание 🏀</title>
<style>
:root{--court:#c98a4b;--court2:#b97a3d;--navy:#14213d;--ball:#ff6b1a;--cream:#fff3dc;--line:#fff3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--cream);background:
repeating-linear-gradient(90deg,var(--court) 0 46px,var(--court2) 46px 48px),var(--court);display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.court{position:relative;width:min(560px,94vw);margin:20px auto;padding:34px 24px 30px;background:var(--navy);border:4px solid var(--line);border-radius:24px;text-align:center;box-shadow:0 0 0 8px rgba(20,33,61,.35)}
.court::before{content:"";position:absolute;left:50%;top:-4px;width:140px;height:70px;transform:translateX(-50%);border:4px solid var(--line);border-top:0;border-radius:0 0 140px 140px}
.ball{font-size:64px;display:inline-block;animation:bounce 1s cubic-bezier(.3,0,.6,1) infinite;margin-top:34px}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(34px) scaleY(.9)}}
h1{font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.05;margin:14px 0 8px;letter-spacing:.5px}
.sub{margin:0 0 22px;font-weight:600;opacity:.85}
.pick{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px}
.game{margin-bottom:22px}.gl{font-family:Oswald,sans-serif;font-size:14px;letter-spacing:1px;text-align:left}
.slots{font-family:Oswald,sans-serif;font-size:46px;display:flex;justify-content:center;gap:6px;background:#000;border:3px solid #ff3b3b;border-radius:12px;padding:4px 16px;width:max-content;margin:8px auto;color:#ff5a3c}.slots b{min-width:28px}.slots .run{color:#ffb15a}.slots .lock{color:#7dff8a}
.arena{position:relative;height:150px}.board{position:absolute;right:14%;top:4px;width:60px;height:44px;border:3px solid var(--line);border-radius:6px;background:rgba(255,255,255,.1)}.rim{position:absolute;right:calc(14% + 10px);top:44px;width:40px;height:14px;border:3px solid var(--ball);border-top:0;border-radius:0 0 22px 22px;background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(255,243,220,.5) 5px 6px)}.gball{position:absolute;left:10%;bottom:4px;font-size:42px;line-height:1;z-index:2}
#throw{background:var(--ball);color:#fff;font-size:22px;padding:12px 30px;box-shadow:0 5px 0 #b34100}#throw:active{transform:translateY(3px);box-shadow:0 2px 0 #b34100}#throw:disabled{opacity:.5}#reset{background:transparent;color:var(--cream);border:2px solid var(--cream);font-size:16px;padding:8px 18px;margin-left:8px}
.pick label{display:block;text-align:left;font-family:Oswald,sans-serif;font-size:14px;letter-spacing:1px;margin-bottom:4px}
.pick input{width:100%;font:800 17px Nunito,sans-serif;padding:11px 10px;border-radius:12px;border:3px solid var(--ball);background:var(--cream);color:var(--navy)}
.btns{position:relative;height:96px}
button{font-family:Oswald,Impact,sans-serif;font-weight:700;cursor:pointer;border:0;border-radius:999px}
#yes{background:var(--ball);color:#fff;font-size:26px;padding:16px 46px;box-shadow:0 6px 0 #b34100;transition:transform .15s}
#yes:hover{transform:scale(1.06)}
#yes:active{transform:translateY(4px);box-shadow:0 2px 0 #b34100}
#no{position:fixed;font-size:20px;padding:11px 26px;background:#ff2e63;color:#fff;border:3px solid #fff;box-shadow:0 0 0 3px #ff2e63,0 0 18px 4px rgba(255,46,99,.8),0 5px 0 #a3002f;animation:pulse 1s ease-in-out infinite;transition:left .18s ease-out,top .18s ease-out;z-index:5}
.hint{min-height:22px;margin:10px 0 0;font-weight:800;font-size:14px;color:#ffd38a}
#win{display:none;position:fixed;inset:0;z-index:20;background:var(--navy);overflow:auto;padding:24px 16px}
#win.on{display:block}
.meme{max-width:460px;margin:0 auto;text-align:center}
.cap{font-family:Impact,Oswald,sans-serif;font-weight:700;font-size:clamp(30px,9vw,46px);line-height:1.05;text-transform:uppercase;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;margin:8px 0}
.pic{position:relative;height:250px;margin:10px 0;border:4px solid var(--line);border-radius:18px;background:radial-gradient(circle at 50% 70%,#2d4a8a,#0e1730);overflow:hidden}
.face{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:150px;animation:shake .35s infinite}
@keyframes shake{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg) scale(1.05)}}
.hoop{position:absolute;right:26px;top:22px;font-size:34px}
.flyball{position:absolute;font-size:44px;left:8%;bottom:20px;animation:shot 1.6s ease-in infinite}
@keyframes shot{0%{transform:translate(0,0) rotate(0)}60%{transform:translate(220px,-170px) rotate(300deg)}80%{transform:translate(255px,-120px) rotate(420deg)}100%{transform:translate(255px,60px) rotate(500deg);opacity:0}}
.score{font-family:Oswald,sans-serif;background:#000;border:3px solid #ff3b3b;color:#ff5a3c;border-radius:12px;padding:10px;margin:14px 0;font-size:22px;letter-spacing:1px}
.score small{display:block;color:#ffd38a;font-size:15px;margin-top:4px}
#copy{background:var(--cream);color:var(--navy);font-size:18px;padding:12px 28px}
.conf{position:fixed;top:-30px;font-size:26px;animation:fall linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.ball,.face,.flyball,#no{animation:none}}
.hoops{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:10px 0 6px;font-family:Oswald,sans-serif;font-size:46px;color:#ff5a3c}
.hoops i{font-style:normal;padding-bottom:6px}
.h{position:relative;width:64px;padding:26px 0 2px;background:#000;border:3px solid #ff3b3b;border-radius:12px;color:#ff5a3c;font:700 46px Oswald,sans-serif;line-height:1.1}
.h:hover{border-color:var(--ball)}.h b{font-weight:700;transition:color .3s}.h.hit b{color:#7dff8a}
.rim2{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:42px;height:14px;border:3px solid var(--ball);border-top:0;border-radius:0 0 22px 22px;background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(255,243,220,.5) 5px 6px)}
.launch{position:relative;height:56px}.launch .gball{left:50%;margin-left:-21px;bottom:6px}
.vid{display:block;width:100%;max-height:62vh;margin:8px 0;border:4px solid var(--line);border-radius:18px;background:#000;object-fit:contain}
.vwrap{position:relative;margin:8px 0}.vwrap .vid{margin:0}.vcap{position:absolute;left:0;right:0;top:7%;padding:0 10px;text-align:center;font-family:Impact,Oswald,sans-serif;font-weight:700;font-size:clamp(26px,8vw,40px);line-height:1.05;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;pointer-events:none}
#win.on{display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));overflow:hidden}
.meme{display:flex;flex-direction:column;width:100%;max-width:460px;height:100%;margin:0}
.meme .cap{font-size:clamp(20px,5.5vw,30px);margin:0 0 6px}
.vwrap{flex:1;min-height:0;margin:0}.vwrap .vid{height:100%;max-height:none}
.when{font-family:Oswald,sans-serif;font-size:18px;color:#ffd38a;margin:8px 0 6px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.row button{font-size:16px;padding:10px 20px}
#redo{background:transparent;color:var(--cream);border:2px solid var(--cream)}
.meme .hint{min-height:18px;margin:4px 0 0;font-size:13px}
#foul{position:fixed;left:50%;top:38%;z-index:40;transform:translate(-50%,-50%) scale(.6) rotate(-6deg);opacity:0;pointer-events:none;text-align:center;font-family:Impact,Oswald,sans-serif;font-weight:700;font-size:clamp(34px,11vw,64px);line-height:1;text-transform:uppercase;color:#ffe14d;background:#d90429;border:4px solid #fff;border-radius:16px;padding:16px 22px;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;box-shadow:0 0 0 6px #d90429;transition:transform .2s,opacity .2s}
#foul.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}
.kinds{margin-bottom:16px}.kr{display:flex;gap:8px;margin-top:6px}.k{flex:1 1 28%;background:rgba(255,243,220,.1);color:var(--cream);border:3px solid transparent;border-radius:14px;padding:10px 4px;font-size:28px;line-height:1.1}.k span{display:block;font:700 15px Oswald,sans-serif;letter-spacing:.5px;margin-top:3px}.k.on{border-color:var(--ball);background:rgba(255,107,26,.28)}
.kr{flex-wrap:wrap}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 16px}.sub:empty{display:none}.s{flex:1 1 auto;background:rgba(255,243,220,.12);color:var(--cream);border:2px solid transparent;border-radius:12px;padding:8px 12px;font:800 15px Nunito,sans-serif}.s.on{border-color:var(--ball);background:rgba(255,107,26,.28)}.k.nope{background:rgba(255,46,99,.25);border-color:#ff2e63;position:relative;z-index:6;transition:transform .18s ease-out}
.where{flex:1;min-height:0;overflow:auto;flex-direction:column;justify-content:center;text-align:left}.where .gl{font-size:20px;margin-bottom:4px}.k{flex:1 1 20%}#skip{background:var(--ball);color:#fff;box-shadow:0 4px 0 #b34100}
.dt{flex:1;min-height:0;overflow:auto;display:none;flex-direction:column;justify-content:center;text-align:center}.dt .pick{margin-bottom:10px}.dt .game{margin-bottom:10px}#dtdone,#wnext{background:var(--ball);color:#fff;box-shadow:0 4px 0 #b34100}.where .row{margin-top:12px}
.h{pointer-events:none}.dt{overflow:visible!important}.launch{height:70px}.launch .gball{z-index:3}
.scene{position:absolute;top:0;bottom:0;left:50%;width:min(100%,460px);transform:translateX(-50%);overflow:hidden;z-index:0;display:none;pointer-events:none}.scene svg{width:100%;height:100%;display:block}.scene::after{content:"";position:absolute;inset:0;background:rgba(10,16,32,.28)}#win.dtmode .scene{display:block}#win .meme{position:relative;z-index:1}#win.dtmode .dt{flex:0 0 auto;margin:auto 0;background:rgba(20,33,61,.56);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border:3px solid var(--line);border-radius:20px;padding:16px 12px}#win.dtmode .dt .gl,#win.dtmode .dt label,#win.dtmode .dt .hint{text-shadow:0 1px 3px #000,0 0 6px #000}
#win.dtmode .dt{margin:2vh 0 auto}
</style>
</head>
<body>
<main class="court">
  <div class="ball">🏀</div>
  <h1>Пойдёшь со мной на свидание?</h1>
  
  <div class="btns"><button id="yes">ДА! 🏀</button></div>
  <button id="no">Нет</button>
  <p class="hint" id="hint">Подумай хорошенько. Вариантов немного 😏</p>
</main>

<section id="win" aria-live="polite"><div class="scene" id="scene" aria-hidden="true"></div><div class="meme"><div class="vwrap"><video id="vid" class="vid" preload="auto" webkit-playsinline src="yes-v2.mp4" playsinline controls></video><div class="vcap">ОНА СКАЗАЛА «ДА»!!!</div></div><div class="row" id="skiprow"><button id="skip">Куда идём? ➜</button></div><div id="where" class="where" style="display:none"><div class="kinds"><div class="gl">КУДА ИДЁМ?</div><div class="kr"><button class="k" data-k="Баскетбольный матч 🏀">🏀<span>Матч</span></button><button class="k" data-k="Кино 🎬">🎬<span>Кино</span></button><button class="k" data-k="Прогулка 🚶‍♀️">🚶‍♀️<span>Прогулка</span></button><button class="k" data-k="Покушать 🍴">🍕<span>Покушать</span></button></div></div><div class="sub" id="sub"></div><p class="hint" id="whint"></p><div class="row"><button id="wnext">Дальше ➜</button></div></div><div id="dt" class="dt" style="display:none"><div class="pick">
    <div><label for="d">ДАТА</label><input type="date" id="d"></div>
    <input type="hidden" id="t">
  </div><div class="game"><div class="gl">ВРЕМЯ: ПЕРЕТАЩИ МЯЧ В КОЛЬЦО. КАЖДОЕ ПОПАДАНИЕ МЕНЯЕТ ЦИФРУ НА +1</div>
  <div class="hoops"><button class="h"><span class="rim2"></span><b>1</b></button><button class="h"><span class="rim2"></span><b>9</b></button><i>:</i><button class="h"><span class="rim2"></span><b>0</b></button><button class="h"><span class="rim2"></span><b>0</b></button></div>
  <div class="launch"><div class="gball" id="gball">🏀</div></div></div><p class="hint" id="dthint">Подходит? Жми «Готово»</p><div class="row"><button id="dtdone">Готово ✅</button></div></div><div class="when" id="when" style="display:none"></div><div class="row" id="row" style="display:none"><button id="copy">Скопировать ответ 📋</button><button id="redo">Перевыбрать</button></div><p class="hint" id="copied"></p></div></section>

<div id="foul" role="alert">🚨 НЕСПОРТИВНЫЙ ФОЛ! 🚨</div>
<script>
const $=s=>document.querySelector(s);
const yes=$('#yes'),no=$('#no'),hint=$('#hint');
const tmr=new Date(Date.now()+864e5);
$('#d').value=tmr.toISOString().slice(0,10);
const lines=["Ой, промахнулась 😅","Кнопка занята, у неё тренировка","Нет? Не слышу, судья не засчитал","Тут только «Да»","Ты почти поймала 🏃","Защита у «Нет» хорошая","Фол! Нажимать «Нет» нельзя","Может, всё-таки «Да»? 🥺"];
let n=0,sc=1;
function place(){const r=yes.getBoundingClientRect();no.style.left=(r.right+14)+'px';no.style.top=(r.top+r.height/2-no.offsetHeight/2)+'px';}
function flee(e){
  if(e&&e.cancelable)e.preventDefault();
  const w=innerWidth-no.offsetWidth-10,h=innerHeight-no.offsetHeight-10;
  const y=yes.getBoundingClientRect();
  let x,t,i=0;
  do{x=10+Math.random()*w;t=10+Math.random()*h;i++}
  while(i<30&&x>y.left-20&&x<y.right+20&&t>y.top-20&&t<y.bottom+20);
  no.style.left=x+'px';no.style.top=t+'px';
  hint.textContent=lines[n++%lines.length];
  sc=Math.min(sc+.07,1.5);yes.style.fontSize=(26*sc)+'px';
}
['mouseenter','mousedown','touchstart','pointerdown','focus','click'].forEach(ev=>no.addEventListener(ev,flee,{passive:false}));
document.addEventListener('mousemove',e=>{
  const r=no.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(Math.hypot(e.clientX-cx,e.clientY-cy)<90)flee();
});
let foulT;no.addEventListener('click',()=>{const f=$('#foul');f.classList.add('on');clearTimeout(foulT);foulT=setTimeout(()=>f.classList.remove('on'),1800);hint.textContent='Свисток! Нажимать «Нет» нельзя 🙅‍♀️'});
addEventListener('load',()=>setTimeout(place,50));
addEventListener('resize',place);
function fmt(){
  const d=$('#d').value,t=$('#t').value;
  if(!d)return 'в удобное время';
  return new Date(d+'T00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+(t?' в '+t:'');
}
yes.addEventListener('click',()=>{
  resetWin();
  $('#win').classList.add('on');const v=$('#vid');v.currentTime=0;v.play().catch(()=>{});
  const em=['🏀','🎉','🔥','🏆','💖'];
  for(let i=0;i<60;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*3)+'s';s.style.animationDelay=Math.random()*1.5+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),7000);}
});
const inTG=()=>location.hash.includes('tgWebApp')||!!window.TelegramWebviewProxy;
function tgEvent(type,data){
  try{
    const W=window.Telegram&&Telegram.WebApp;
    if(W){if(type==='ready')return W.ready();if(type==='expand')return W.expand();if(type==='send')return W.sendData(data.data)}
    const t={ready:'web_app_ready',expand:'web_app_expand',send:'web_app_data_send'}[type];
    if(window.parent!==window)window.parent.postMessage(JSON.stringify({eventType:t,eventData:data||{}}),'*');
    else if(window.TelegramWebviewProxy)TelegramWebviewProxy.postEvent(t,JSON.stringify(data||{}));
  }catch(e){}
}
tgEvent('ready');tgEvent('expand');
if(inTG())$('#copy').textContent='Отправить ответ 💌';
$('#copy').addEventListener('click',async()=>{
  if(inTG()){$('#copied').textContent='Отправляю…';tgEvent('send',{data:JSON.stringify({text:kind+': '+fmt()})});return}
  const msg='Я согласна! 🏀 Свидание: '+kind+', '+fmt();
  try{await navigator.clipboard.writeText(msg);$('#copied').textContent='Скопировано, отправь это ему 😉';}
  catch(e){$('#copied').textContent=msg;}
});
let kind='',base='',sub='';
const SUBS={'Кино 🎬':['Фильм выберу я','Фильм выберешь ты'],'Покушать 🍴':['Бургеры 🍔','Пицца 🍕','Хачапури 🧀']};
function upd(){kind=base?base+(sub?' ('+sub+')':''):''}
function renderSub(){
  const box=$('#sub');box.innerHTML='';
  const o=SUBS[base];if(!o)return;
  o.forEach(t=>{const b=document.createElement('button');b.className='s'+(sub===t?' on':'');b.textContent=t;
    b.onclick=()=>{sub=t;box.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd();updateWhen()};
    box.appendChild(b)});
}
document.querySelectorAll('.k').forEach(k=>k.addEventListener('click',()=>{
  document.querySelectorAll('.k').forEach(x=>x.classList.remove('on'));k.classList.add('on');$('#whint').textContent='';
  base=k.dataset.k;sub='';
  renderSub();upd();updateWhen();
  
}));
const H=[...document.querySelectorAll('.h')],gb=$('#gball');
let vals=[1,9,0,0],fly=false;
const mx=i=>i==0?2:i==1?(vals[0]==2?3:9):i==2?5:9;
function render(){H.forEach((h,i)=>h.querySelector('b').textContent=vals[i]);$('#t').value=''+vals[0]+vals[1]+':'+vals[2]+vals[3]}
gb.style.touchAction='none';gb.style.cursor='grab';gb.style.userSelect='none';gb.style.webkitUserSelect='none';
let drag=null;
const ctr=r=>({x:r.left+r.width/2,y:r.top+r.height/2});
gb.addEventListener('pointerdown',e=>{
  if(fly||drag)return;e.preventDefault();
  try{gb.setPointerCapture(e.pointerId)}catch(_){}
  drag={sx:e.clientX,sy:e.clientY,x:0,y:0,home:ctr(gb.getBoundingClientRect()),pts:[{x:e.clientX,y:e.clientY,t:performance.now()}]};
  gb.style.cursor='grabbing';
});
gb.addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.x=e.clientX-drag.sx;drag.y=e.clientY-drag.sy;
  gb.style.transform=`translate(${drag.x}px,${drag.y}px)`;
  drag.pts.push({x:e.clientX,y:e.clientY,t:performance.now()});if(drag.pts.length>6)drag.pts.shift();
});
function finish(i,hoop){
  vals[i]=vals[i]>=mx(i)?0:vals[i]+1;
  if(vals[0]==2&&vals[1]>3)vals[1]=0;
  render();hoop.classList.add('hit');setTimeout(()=>hoop.classList.remove('hit'),450);
  $('#dthint').textContent='Свидание в '+$('#t').value+'. Подходит? Жми «Готово»';
}
function release(e){
  if(!drag)return;
  const d=drag;drag=null;gb.style.cursor='grab';
  const p=d.pts,f=p[0],l=p[p.length-1],dt=Math.max(l.t-f.t,1);
  let vx=(l.x-f.x)/dt,vy=(l.y-f.y)/dt;
  if(l.t-performance.now()<-120){vx=0;vy=0}
  const cur={x:d.home.x+d.x,y:d.home.y+d.y};
  const land={x:cur.x+vx*110,y:cur.y+vy*110};
  let best=-1,bd=1e9;
  H.forEach((h,i)=>{const c=ctr(h.querySelector('.rim2').getBoundingClientRect());const dd=Math.min(Math.hypot(c.x-land.x,c.y-land.y),Math.hypot(c.x-cur.x,c.y-cur.y));if(dd<bd){bd=dd;best=i}});
  if(d.x===0&&d.y===0){gb.style.transform='';return}
  if(bd<75){
    fly=true;
    const t=ctr(H[best].querySelector('.rim2').getBoundingClientRect());
    const tx=t.x-d.home.x,ty=t.y-d.home.y;
    const T=1300,xe=innerWidth-d.home.x+70,gx=tx+25;
    const px=o=>gx+(xe-gx)*((o-.44)/.56);
    const k=(o,x,y,r,e)=>({offset:o,transform:`translate(${x}px,${y}px) rotate(${r}deg)`,easing:e});

      k(.88,px(.88),0,1070,'ease-out'),
      k(1,xe,0,1400,'linear')

    setTimeout(()=>finish(best,H[best]),T*.32);
    setTimeout(()=>{fly=false},950);
  }else{
    fly=true;
    const an=gb.animate([{transform:`translate(${d.x}px,${d.y}px)`},{transform:'translate(0,0)'}],{duration:400,easing:'ease-out'});
